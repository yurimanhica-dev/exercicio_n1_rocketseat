name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore ./Exercicios_nivel1.sln
      - name: Clean
        run: dotnet clean ./Exercicios_nivel1.sln
      - name: Build
        run: dotnet build ./Exercicios_nivel1.sln --no-restore
      - name: Test
        run: dotnet test ./Exercicios_nivel1.sln --no-restore --no-build --verbosity normal
